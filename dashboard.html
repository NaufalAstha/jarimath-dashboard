<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="description" content="Dashboard admin Jarimath Kids">
  <title>Dashboard — Jarimath Kids</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html" aria-label="Jarimath Kids">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span class="brand-name">jarimath<span> kids</span></span>
      </a>
      <p class="nav-label">MENU UTAMA</p>
      <nav aria-label="Menu utama">
        <a class="nav-item nav-item-active" href="#dashboard" data-view="dashboard" aria-current="page">
          <span class="nav-icon" aria-hidden="true">▦</span> Dashboard
        </a>
        <a class="nav-item" href="#siswa" data-view="siswa">
          <span class="nav-icon" aria-hidden="true">♧</span> Data Siswa
        </a>
        <a class="nav-item" href="#mentor" data-view="mentor">
          <span class="nav-icon" aria-hidden="true">♙</span> Data Mentor
        </a>
        <a class="nav-item" href="#keuangan" data-view="keuangan">
          <span class="nav-icon" aria-hidden="true">▤</span> Laporan Keuangan
        </a>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card">
          <span class="help-icon" aria-hidden="true">i</span>
          <p><strong>Butuh bantuan?</strong><br><span>Hubungi tim Jarimath Kids.</span></p>
        </div>
        <div class="sidebar-caption">ADMINISTRASI JARIMATH KIDS</div>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div>
          <p class="topbar-label">PORTAL ADMIN</p>
          <p class="topbar-brand">Jarimath Kids</p>
        </div>
        <div class="account-area">
          <div class="account-copy">
            <span class="account-name">Admin</span>
            <span id="account-email" class="account-email"></span>
          </div>
          <span class="avatar" aria-hidden="true">A</span>
          <button id="logout-button" class="button button-quiet" type="button">Keluar</button>
        </div>
      </header>

      <main class="dashboard-content">
        <section class="welcome-row">
          <div>
            <p class="eyebrow" id="view-eyebrow">OVERVIEW</p>
            <h1 id="view-title">Dashboard</h1>
            <p class="muted" id="view-description">Ringkasan pengelolaan Jarimath Kids.</p>
          </div>
        </section>
        <div id="view-container"></div>
        <p id="dashboard-message" class="dashboard-message" role="status" aria-live="polite"></p>
      </main>
    </div>
  </div>

  <dialog id="data-dialog" class="data-dialog">
    <form id="data-form" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">FORMULIR DATA</p>
          <h2 id="dialog-title">Tambah data</h2>
        </div>
        <button class="dialog-close" type="button" data-close-dialog aria-label="Tutup">×</button>
      </div>
      <div id="dialog-fields" class="dialog-fields"></div>
      <div class="dialog-actions">
        <button class="button button-outline" type="button" data-close-dialog>Batal</button>
        <button class="button button-primary" type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
