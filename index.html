<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="description" content="Login admin Jarimath Kids">
  <title>Masuk — Jarimath Kids</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="login-page" class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand brand-login" href="index.html" aria-label="Jarimath Kids">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span class="brand-name">jarimath<span> kids</span></span>
      </a>
      <div class="login-heading">
        <p class="eyebrow">PORTAL ADMIN</p>
        <h1 id="login-title">Selamat datang</h1>
        <p class="muted">Masuk untuk mengelola Jarimath Kids.</p>
      </div>
      <form id="login-form" class="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
        <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
        <button id="login-button" class="button button-primary button-full" type="submit">
          <span>Login</span>
        </button>
      </form>
    </section>
    <footer class="page-footer">© <span data-current-year></span> Jarimath Kids</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/config.local.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
