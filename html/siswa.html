<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="description" content="Kelola data siswa Jarimath Kids">
  <title>Data Siswa — Jarimath Kids</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="siswa">
  <div class="dashboard-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html" aria-label="Jarimath Kids">
        <span class="brand-name">jarimath<span> kids</span></span>
      </a>
      <p class="nav-label">MENU UTAMA</p>
      <nav aria-label="Menu utama">
        <a class="nav-item" href="dashboard.html">Dashboard</a>
        <a class="nav-item nav-item-active" href="siswa.html" aria-current="page">Data Siswa</a>
        <a class="nav-item" href="mentor.html">Data Mentor</a>
        <a class="nav-item" href="keuangan.html">Laporan Keuangan</a>
      </nav>
      <div class="sidebar-bottom"></div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div>
          <p class="topbar-label">PORTAL ADMIN</p>
          <p class="topbar-brand">Jarimath Kids</p>
        </div>
        <div class="account-area">
          <div class="account-copy">
            <span class="account-name">Admin</span>
            <span id="account-email" class="account-email"></span>
          </div>
          <span class="avatar" aria-hidden="true">A</span>
          <button id="logout-button" class="button button-quiet" type="button">Keluar</button>
        </div>
      </header>

      <main class="dashboard-content">
        <section class="welcome-row">
          <div>
            <p class="eyebrow">DATA MASTER</p>
            <h1>Data siswa</h1>
            <p class="muted">Kelola daftar siswa dan status kelasnya.</p>
          </div>
        </section>
        <div id="view-container">
          <section class="content-card">
            <div class="section-heading table-heading">
              <div><h2>Data siswa</h2><p class="muted" id="result-count"></p></div>
              <div class="table-toolbar">
                <label class="search-box"><span class="visually-hidden">Cari data</span><input id="table-search" type="search" placeholder="Cari data..." autocomplete="off"></label>
                <button class="button button-primary" type="button" data-action="add">+ Tambah siswa</button>
              </div>
            </div>
            <div class="table-wrap">
              <table id="data-table">
                <thead><tr><th>Nama</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
        </div>
        <p id="dashboard-message" class="dashboard-message" role="status" aria-live="polite"></p>
      </main>
    </div>
  </div>

  <dialog id="data-dialog" class="data-dialog">
    <form id="data-form" method="dialog">
      <div class="dialog-heading">
        <div><p class="eyebrow">FORMULIR DATA</p><h2 id="dialog-title">Tambah data</h2></div>
        <button class="dialog-close" type="button" data-close-dialog aria-label="Tutup">×</button>
      </div>
      <div id="dialog-fields" class="dialog-fields"></div>
      <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
      <div class="dialog-actions">
        <button class="button button-outline" type="button" data-close-dialog>Batal</button>
        <button class="button button-primary" type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
